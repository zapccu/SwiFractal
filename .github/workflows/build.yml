name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      metal64_ref:
        description: "Metal64 revision/branch for the Metal headers (empty = revision pinned in Package.resolved)"
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: xcodebuild (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install MPFR and GMP (needed by SwiftMPx)
        run: brew install mpfr gmp pkgconf

      # The Metal shaders include Metal64 headers via MTL_HEADER_SEARCH_PATHS = $(SRCROOT)/../Metal64/...
      # Check out Metal64 next to the project, at the revision pinned in Package.resolved
      - name: Check out Metal64 headers
        run: |
          REV="${{ inputs.metal64_ref }}"
          [ -n "$REV" ] || REV=$(python3 -c "import json; d=json.load(open('SwiFractal.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved')); print(next(p['state']['revision'] for p in d['pins'] if p['identity'] == 'metal64'))")
          git clone --quiet https://github.com/zapccu/Metal64 ../Metal64
          git -C ../Metal64 checkout --quiet "$REV"
          echo "Metal64 at $REV"

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || echo "Metal toolchain already installed or not required"

      - name: Build Debug
        run: |
          set -o pipefail
          xcodebuild build \
            -project SwiFractal.xcodeproj \
            -scheme "SwiFractal Debug" \
            -configuration Debug \
            -destination "platform=macOS" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Show errors and warnings
        if: always()
        run: grep -E "(error|warning):" build.log | sort -u | head -200 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
